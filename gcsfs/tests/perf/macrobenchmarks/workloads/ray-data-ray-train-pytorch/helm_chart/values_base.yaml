# Default values use the CPU translation. Set workload.gpu=true to request
# one NVIDIA GPU for each Ray Train worker process.
nodeSelector:
  cloud.google.com/gke-nodepool: c4-standard-192

serviceAccount: default
namespace: default
workload_launcher: launcher.sh

workload:
  configFile: llama_3_1_8b_ray_train.py
  configPath: /workload/configs/
  image: nvcr.io/nvidia/pytorch:26.05-py3
  gpu: false
  nodes: 2
  ranksPerNode: 4
  singlePodPerNode: true
  steps: -1
  epochs: 3
  hfToken:
  ckptWriterInterval: 25
  ckptToKeep: 1
  checkpointUploadTimeoutSeconds: 1800
  overwriteExistingRun: false
  sharedMemorySize: 250Gi
  rayObjectStoreMemoryBytes: "50000000000"
  torchDistributedTimeoutSeconds: 900
  perDeviceBatch: 8
  gradAccum: 1
  dataloaderWorkers: 16
  dataloaderPrefetchFactor: 2
  # Empty leaves Ray Data's read concurrency to its own resource-based sizing.
  # Set it only to impose a deliberate cap on the GCS read path under test.
  readConcurrency:
  tokenizeBatchSize: 64
  shuffleFiles: true
  shuffleBufferSize: 10000
  modelId: "gs://huggingface-model-weights/Llama-3.1-8B"
  trainingStrategy: ddp
  tensorParallelSize: 4
  dataParallelSize: 2
  simulatedStepComputeSeconds: 1.0
  learningRate: 2e-5
  weightDecay: 1e-6
  warmupRatio: 0.03
  maxGradNorm: 1.0
  requirements:
  envs:
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: LOG_LEVEL
      value: INFO
    - name: GCSFS_LOG_LEVEL
      value: INFO

gcsfs:
  datasetPath: ""
  ckptWritePath: ""
  ckptLoadPath: ""
