serviceAccount: default

network:
  hostNetwork: true
  gibVersion: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
  masterPort: "29500"

# Optional nodeSelector for targeting specific GPU nodepools (e.g., a3-ultragpu-8g)
nodeSelector: {}

gcsfs:
  datasetPath: "gs://zhixiangli-gcsfs-performance-standard-ew1/dataset16"
  ckptWritePath: "gs://zhixiangli-gcsfs-performance-standard-ew1/checkpoints"
  ckptLoadPath: ""

workload:
  image: nvcr.io/nvidia/pytorch:26.08-py3
  nodes: 2
  ranksPerNode: 8
  singlePodPerNode: true
  shmSize: "512Gi"
  hostCachePath: "/var/lib/gcsfs-macrobench"
  envs: []

  torchDistributedTimeoutSeconds: "3600"
  # Tokenizer / model config path on GCS or HuggingFace Hub
  modelId: "gs://zhixiangli-gcsfs-performance-standard-ew1/models/Llama-3.1-8B"
  hfToken: ""

  # Llama 3.1 model flavor: "70B" (benchmark) or "debugmodel" (smoke/unit tests;
  # needs a vocab-2048 tokenizer, e.g. TorchTitan's tests/assets).
  modelFlavor: "70B"
  seqLen: "2048"
  # TorchTitan attention backend. "flex" works out of the box; upstream's default
  # "varlen" needs FlashAttention 3 (flash_attn_interface) in the image.
  attnBackend: "flex"

  steps: 50
  ckptWriterInterval: 25
  ckptToKeep: 1
  perDeviceBatch: 1
  gradAccum: 1
  # Rows kept per rank by Grain's streaming window shuffle.
  shuffleBufferSize: 1000

  # TorchTitan main tracks PyTorch nightly; torch and torchao are installed from
  # this index over the image's build.
  torchNightlyIndex: "https://download.pytorch.org/whl/nightly/cu132"

  # Parallelism & checkpointing strategy:
  #   - "fsdp_sharded": 1D FSDP2 + sharded PyTorch DCP checkpointing
  #   - "model_parallel_sharded": Up to 5D Parallelism (PP + HSDP dp_replicate/dp_shard + CP + TP) + sharded PyTorch DCP checkpointing
  #     WORLD_SIZE = pipelineParallelSize * dpReplicateSize * dataParallelSize * contextParallelSize * tensorParallelSize
  trainingStrategy: "model_parallel_sharded"
  tensorParallelSize: 4
  dataParallelSize: 4
  dpReplicateSize: 1
  contextParallelSize: 1
  pipelineParallelSize: 1
  requirements: ""
