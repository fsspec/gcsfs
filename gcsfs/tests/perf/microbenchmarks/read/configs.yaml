common:
  bucket_types:
    - "regional"
    - "zonal"
    - "standard_rcu_z"
    - "standard_rcu_warm"
    - "standard_rcu_cold"
    - "hns_rcu_z"
    - "hns_rcu_warm"
    - "hns_rcu_cold"
  file_sizes_mb:
    - 20480 # 20 GB
  chunk_sizes_mb:
    - 0.0625
    - 1
    - 16
    - 100
  rounds: 5
  runtime: 30 # 30 secs

scenarios:
  - name: "read_seq_fixed_duration"
    pattern: "seq"
    processes: [1, 16]
    files: 1

  - name: "read_rand_fixed_duration"
    pattern: "rand"
    processes: [1, 16]
    files: 1

  - name: "read_seq_fixed_duration_multi_thread"
    pattern: "seq"
    threads: [32]
    files: 1
    processes: [1]

  - name: "read_rand_fixed_duration_multi_thread"
    pattern: "rand"
    threads: [32]
    files: 1
    processes: [1]

  - name: "read_reopen_fixed_duration"
    pattern: "reopen"
    bucket_types:
      - "zonal"
      - "standard_rcu_z"
      - "standard_rcu_warm"
      - "standard_rcu_cold"
      - "hns_rcu_z"
      - "hns_rcu_warm"
      - "hns_rcu_cold"
    file_sizes_mb:
      - 256
    chunk_sizes_mb:
      - 1
    mrd_pool_cache_sizes:
      - 16
      - 0
    mrd_pool_sizes:
      - 1
      - 4
    threads: [1]

  - name: "read_mixed_fixed_duration"
    pattern: "mixed"
    min_chunk_sizes_mb: [0.0625]
    max_chunk_sizes_mb: [1024]
    seq_probabilities: [0.3, 0.5, 0.7] # 30% sequential, 50% sequential, 70% sequential
