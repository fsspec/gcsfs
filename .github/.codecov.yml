ignore:
  - "gcsfs/tests/**/*"

codecov:
  require_ci_to_pass: true

# Post commit statuses in one request on PRs so 404 errors on PATCH
# never leave runs stuck (codecov/codecov-action#1979).
github_checks: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%  # Allow up to 0.5% drop.
    patch:
      default:
        target: 80%
        threshold: 0%
