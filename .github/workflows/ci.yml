name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

# Read-only by default. When a release workflow calls this one with
# `contents: write`, jobs without their own permissions block would
# otherwise inherit that write token.
permissions:
  contents: read

defaults:
  run:
    shell: bash -l -eo pipefail {0}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      STORAGE_EMULATOR_HOST: http://localhost:4443

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          environment-file: environment_gcsfs.yaml
          python-version: ${{ matrix.python-version }}
          activate-environment: gcsfs_test
          conda-remove-defaults: "true"

      - name: Conda info
        run: |
          conda list
          conda --version

      - name: install
        run: |
          pip install -e .

      - name: Start GCS Emulator
        run: |
          docker run -d -p 4443:4443 --name gcsfs_test fsouza/fake-gcs-server:latest -scheme http -public-host 0.0.0.0:4443 -external-url http://localhost:4443 -backend memory
          timeout 30s bash -c 'until curl -s http://localhost:4443/storage/v1/b; do sleep 1; done'

      - name: Run Standard Bucket Tests with extended feature support turned OFF
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcsfs/tests/fake-service-account-credentials.json
          export GCSFS_EXPERIMENTAL_ZB_HNS_SUPPORT="false"
          pytest -vv -s \
          --cov=gcsfs --cov-report=xml \
          --log-format="%(asctime)s %(levelname)s %(message)s" \
          --log-date-format="%H:%M:%S" \
          -n auto \
          gcsfs/
      - name: Run Benchmark Infrastructure Unit Tests
        run: |
          pip install -r gcsfs/tests/perf/microbenchmarks/requirements.txt
          pytest gcsfs/tests/perf/microbenchmarks --run-benchmarks-infra
      - name: Run Macrobenchmark Infrastructure Unit Tests
        run: |
          pip install -r cloudbuild/macrobenchmarks/metrics/requirements.txt
          PYTHONPATH=cloudbuild/macrobenchmarks pytest cloudbuild/macrobenchmarks/metrics/tests
      - name: Run Release Automation Tests
        run: |
          pytest -vv .github/release/
      - name: Run Cloud Build Test Report Unit Tests
        run: |
          pytest -vv cloudbuild/test_summarize_test_results.py
      - name: Run all tests (Standard, Zonal & HNS Enabled) with default ON extended feature support
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcsfs/tests/fake-service-account-credentials.json
          pytest -vv -s \
            --cov=gcsfs --cov-append --cov-report=xml \
            --log-format="%(asctime)s %(levelname)s %(message)s" \
            --log-date-format="%H:%M:%S" \
            -n auto \
            gcsfs/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  subsystembenchmark-unit-tests:
    name: Subsystem benchmark unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORAGE_EMULATOR_HOST: http://localhost:4443
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gcsfs/tests/perf/subsystembenchmarks/dataloading/huggingface_datasets/requirements.txt
            gcsfs/tests/perf/subsystembenchmarks/dataloading/webdataset/requirements.txt
            gcsfs/tests/perf/subsystembenchmarks/dataloading/ray_data/requirements.txt
      - name: Install subsystem benchmark dependencies
        # Resolve dependencies together to catch version conflicts.
        run: |
          python -m pip install -e .
          python -m pip install \
            -r gcsfs/tests/perf/subsystembenchmarks/dataloading/huggingface_datasets/requirements.txt \
            -r gcsfs/tests/perf/subsystembenchmarks/dataloading/webdataset/requirements.txt \
            -r gcsfs/tests/perf/subsystembenchmarks/dataloading/ray_data/requirements.txt
      - name: Run subsystem benchmark unit tests
        run: pytest gcsfs/tests/perf/subsystembenchmarks --run-benchmarks-infra

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
