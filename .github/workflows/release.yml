name: Release

# Creates a GitHub release, and publishes to PyPI.
# Runs on push of a release tag.
on:
  push:
    tags:
      - "2[0-9][0-9][0-9].[0-9].[0-9]*"
      - "2[0-9][0-9][0-9].[0-9][0-9].[0-9]*"

jobs:
  release:
    permissions:
      contents: write
      checks: read
      statuses: read
    uses: ./.github/workflows/build-and-release.yml
    with:
      ref: ${{ github.ref_name }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Upload release to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
