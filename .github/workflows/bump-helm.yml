name: Bump Helm Pin

# Weekly: if Helm published a newer release in the pinned major version, update
# HELM_VERSION/HELM_SHA256 in cloudbuild/macrobenchmarks/scripts/lib.sh and open
# a PR. bump_helm.py only rewrites the pin after get.helm.sh, the GitHub release
# notes and the downloaded tarball all agree on the SHA-256. Major upgrades are
# left to a human.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  bump:
    if: github.repository == 'fsspec/gcsfs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update the pin
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 cloudbuild/macrobenchmarks/scripts/bump_helm.py)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="automation/bump-helm-${VERSION}"
          if gh pr list --head "$branch" --state all --json number --jq '.[0].number' | grep -q .; then
            echo "A PR for helm ${VERSION} already exists; nothing to do."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add cloudbuild/macrobenchmarks/scripts/lib.sh
          git commit -m "build(macrobenchmarks): bump helm to ${VERSION}"
          git push --force origin "$branch"
          gh pr create \
            --title "build(macrobenchmarks): bump helm to ${VERSION}" \
            --body "Automated weekly bump of the pinned Helm used by the macrobenchmark Cloud Build steps. The SHA-256 matched in get.helm.sh, the GitHub release notes (https://github.com/helm/helm/releases/tag/${VERSION}) and the downloaded tarball. Check the release notes for behaviour changes before merging." \
            --head "$branch" \
            --base main
