name: gcsfs_test
channels:
  - conda-forge
dependencies:
  - python
  - aiohttp
  - python-build
  - crcmod
  - decorator
  - fsspec
  - google-api-core
  - google-api-python-client
  - google-auth
  - google-auth-oauthlib
  - google-cloud-core
  - google-cloud-storage
  - grpcio
  - hatchling
  - hatch-vcs
  - pytest
  - pytest-timeout
  - pytest-asyncio
  - pytest-cov
  - pytest-subtests
  - pytest-xdist
  - requests
  - ujson
  - pip:
      # fsspec master requires Python >= 3.11, so Python 3.10 tests against
      # fsspec 2026.9.0, the latest release that supports it. Drop the 3.10
      # pin (and the 3.10 CI job) once gcsfs requires a newer fsspec.
      - fsspec @ git+https://github.com/fsspec/filesystem_spec ; python_version >= "3.11"
      - fsspec==2026.9.0 ; python_version < "3.11"
